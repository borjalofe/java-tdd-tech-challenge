services:
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    ports:
      - "8089:8089"
    volumes:
      - ./kata:/app/kata
    environment:
      KATA_DIR: /app/kata
      PORT: "8089"

  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: bash -lc "corepack enable && pnpm install && pnpm --dir web dev --host 0.0.0.0 --port 5173"
    depends_on:
      - runner
